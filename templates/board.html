<title>Mission Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Dark-first: bare :root is the console; light ("daylight ops") overrides below. */
  :root {
    --ground: #0E1420;
    --panel: #16202F;
    --line: #2A3850;
    --ink: #D9E2EE;
    --mute: #8493AA;
    --accent: #E8604C;
    --scan: rgba(217, 226, 238, 0.025);
    --idea: #8FA3E8;      --idea-soft: #222C4A;
    --active: #55C97A;    --active-soft: #17331F;
    --parked: #E0A73F;    --parked-soft: #3A2E14;
    --shipped: #5FA8D3;   --shipped-soft: #182B3B;
    --dropped: #77808F;   --dropped-soft: #232936;
    --chip-hot-bg: #E0A73F;
    --chip-hot-fg: #0E1420;
    --toggle: #3ECFC4;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --ground: #EDF0F4;
      --panel: #FBFCFE;
      --line: #D3DAE4;
      --ink: #17202E;
      --mute: #627085;
      --accent: #C24736;
      --scan: rgba(23, 32, 46, 0.02);
      --idea: #4A5DB0;      --idea-soft: #E7EAF8;
      --active: #2E7A48;    --active-soft: #E2F1E7;
      --parked: #A2731B;    --parked-soft: #F6EDD8;
      --shipped: #2E6E96;   --shipped-soft: #E2EEF6;
      --dropped: #7A8090;   --dropped-soft: #EAECEF;
      --chip-hot-bg: #A2731B;
      --chip-hot-fg: #FBFCFE;
      --toggle: #178F86;
    }
  }
  :root[data-theme="light"] {
    --ground: #EDF0F4;
    --panel: #FBFCFE;
    --line: #D3DAE4;
    --ink: #17202E;
    --mute: #627085;
    --accent: #C24736;
    --scan: rgba(23, 32, 46, 0.02);
    --idea: #4A5DB0;      --idea-soft: #E7EAF8;
    --active: #2E7A48;    --active-soft: #E2F1E7;
    --parked: #A2731B;    --parked-soft: #F6EDD8;
    --shipped: #2E6E96;   --shipped-soft: #E2EEF6;
    --dropped: #7A8090;   --dropped-soft: #EAECEF;
    --chip-hot-bg: #A2731B;
    --chip-hot-fg: #FBFCFE;
    --toggle: #178F86;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    background-image: repeating-linear-gradient(
      to bottom, var(--scan) 0px, var(--scan) 1px, transparent 1px, transparent 4px);
    color: var(--ink);
    font-family: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.45;
  }

  .wrap { max-width: 1200px; margin: 0 auto; padding: 26px 24px 56px; }

  header {
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    border-bottom: 1px solid var(--line);
    padding-bottom: 14px;
  }
  .livedot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--active); align-self: center; flex-shrink: 0;
  }
  @media (prefers-reduced-motion: no-preference) {
    .livedot { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  }
  .wordmark {
    font-family: "Rajdhani", "Arial Narrow", sans-serif;
    font-weight: 700; font-size: 30px; letter-spacing: 0.14em;
    text-transform: uppercase; margin: 0;
  }
  .wordmark::after { content: "_"; color: var(--accent); }
  .tally {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px; color: var(--mute);
    letter-spacing: 0.05em; text-transform: uppercase;
    font-variant-numeric: tabular-nums;
  }
  .stamp {
    margin-left: auto;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11.5px; color: var(--mute);
    letter-spacing: 0.05em; text-transform: uppercase;
  }

  .nag {
    margin: 18px 0 24px;
    border: 1px solid var(--parked);
    background: var(--panel);
    padding: 11px 16px;
    border-radius: 2px;
    display: none;
  }
  .nag .nag-label {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.1em; color: var(--parked);
    text-transform: uppercase; margin-right: 8px;
  }
  .nag .nag-unblock { color: var(--mute); }

  .columns {
    display: flex; gap: 16px; align-items: flex-start;
    overflow-x: auto; padding-bottom: 8px; margin-top: 22px;
  }
  .col { flex: 1 1 0; min-width: 236px; }
  .col-head {
    display: flex; align-items: baseline; gap: 8px;
    font-family: "Rajdhani", "Arial Narrow", sans-serif;
    font-weight: 600; font-size: 17px; letter-spacing: 0.12em;
    text-transform: uppercase;
    padding-bottom: 7px; margin-bottom: 12px;
    border-bottom: 2px solid var(--line);
  }
  .col-head .callsign {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10.5px; font-weight: 400; letter-spacing: 0.08em;
  }
  .col-head .count {
    margin-left: auto;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px; font-weight: 400; color: var(--mute);
    font-variant-numeric: tabular-nums;
  }
  .col-idea    .col-head { color: var(--idea);    border-bottom-color: var(--idea); }
  .col-active  .col-head { color: var(--active);  border-bottom-color: var(--active); }
  .col-shipped .col-head { color: var(--shipped); border-bottom-color: var(--shipped); }
  .col-parked  .col-head { color: var(--parked);  border-bottom-color: var(--parked); }
  .col-dropped .col-head { color: var(--dropped); border-bottom-color: var(--dropped); }

  .stack { display: flex; flex-direction: column; gap: 10px; }

  .cardx {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 12px 14px 12px 16px;
    position: relative;
  }
  .cardx::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px;
  }
  .cardx.s-idea::before    { background: var(--idea); }
  .cardx.s-active::before  { background: var(--active); }
  .cardx.s-shipped::before { background: var(--shipped); }
  .cardx.s-parked::before  { background: var(--parked); }
  .cardx.s-dropped::before { background: var(--dropped); }

  .card-top { display: flex; align-items: flex-start; gap: 8px; }
  .title { font-weight: 600; font-size: 14.5px; margin: 0; text-wrap: balance; }
  .area {
    margin-left: auto; flex-shrink: 0;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--mute);
    border: 1px solid var(--line); border-radius: 2px;
    padding: 1px 6px;
  }

  .days {
    display: inline-block; margin-top: 8px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px; font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
    border-radius: 2px; padding: 2px 7px;
    background: var(--parked-soft); color: var(--parked);
  }
  .days.hot { background: var(--chip-hot-bg); color: var(--chip-hot-fg); font-weight: 500; }
  .days.cool { background: var(--dropped-soft); color: var(--mute); }

  .why { margin: 8px 0 0; color: var(--mute); font-style: italic; }
  .next { margin: 8px 0 0; }
  .next b {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-weight: 500; font-size: 10.5px; letter-spacing: 0.08em;
    text-transform: uppercase; font-style: normal;
  }
  .s-idea .next b    { color: var(--idea); }
  .s-active .next b  { color: var(--active); }
  .s-parked .next b  { color: var(--parked); }
  .check { margin-top: 10px; }
  .check + .check { margin-top: 4px; }
  .check-head {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12.5px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--ink); font-variant-numeric: tabular-nums;
    cursor: pointer; user-select: none; list-style: none;
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; border: 1px solid var(--line); border-radius: 2px;
    background: var(--ground);
  }
  .check-head::-webkit-details-marker { display: none; }
  .check-head::before {
    content: "▶"; font-size: 10px; color: var(--toggle);
    transition: transform 0.15s; flex-shrink: 0;
  }
  .check[open] .check-head::before { transform: rotate(90deg); }
  .check-head::after {
    content: "show"; margin-left: auto;
    font-size: 10.5px; font-weight: 400; letter-spacing: 0.08em; color: var(--mute);
  }
  .check[open] .check-head::after { content: "hide"; }
  .check-head:hover { border-color: var(--toggle); }
  .check[open] .check-head { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  .tasks { margin: 0; padding: 6px 8px 4px; list-style: none; font-size: 12.5px; border: 1px solid var(--line); border-top: 0; }
  .task { display: flex; gap: 7px; margin-top: 3px; align-items: baseline; }
  .task .box {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    color: var(--mute); flex-shrink: 0;
  }
  .task.done .box { color: var(--active); }
  .task.done .task-text { text-decoration: line-through; color: var(--mute); }
  .notes { margin: 0; padding: 6px 8px 6px 24px; color: var(--mute); font-size: 12.5px; border: 1px solid var(--line); border-top: 0; }
  .notes li { margin-top: 3px; }
  .meta {
    margin-top: 8px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px; color: var(--shipped); font-variant-numeric: tabular-nums;
    letter-spacing: 0.05em; text-transform: uppercase;
  }

  .empty { color: var(--mute); font-style: italic; padding: 4px 2px; }

  footer {
    margin-top: 28px; padding-top: 14px;
    border-top: 1px solid var(--line);
    font-size: 12px; color: var(--mute);
  }
  footer code {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 2px; padding: 1px 5px; font-size: 11px;
  }
</style>

<div class="wrap">
  <header>
    <span class="livedot" aria-hidden="true"></span>
    <h1 class="wordmark">Mission Control</h1>
    <span class="tally" id="tally"></span>
    <span class="stamp" id="stamp"></span>
  </header>

  <div class="nag" id="nag"></div>

  <div class="columns" id="columns"></div>

  <footer>Every mission on hold keeps its clearance to resume. Update via <code>/board</code> in Claude Code.</footer>
</div>

<script>
// BOARD-DATA-START  (the /board skill replaces only this constant)
const BOARD = {
  "updated": "2026-08-25",
  "board": null,
  "projects": [
    {
      "id": "board-plugin",
      "title": "Project board (/board skill)",
      "area": "tools",
      "status": "active",
      "next_action": "Use it for a week, then extract into a shareable plugin",
      "tasks": [
        {
          "text": "Build skill + three display layers",
          "done": true,
          "done_on": "2026-08-25"
        },
        {
          "text": "Mission-control restyle + subtasks",
          "done": true,
          "done_on": "2026-08-25"
        },
        {
          "text": "Split into per-repo boards with discovery + registry",
          "done": true,
          "done_on": "2026-08-25"
        },
        {
          "text": "Use daily for a week",
          "done": false
        },
        {
          "text": "Extract into a shareable plugin (marketplace repo + plugin.json)",
          "done": false
        }
      ],
      "notes": [
        "Built 2026-08-25: skill + BOARD.md + Mission Control artifact."
      ]
    },
    {
      "id": "board-plugin-release",
      "title": "Publish /board as a plugin",
      "area": "tools",
      "status": "idea",
      "next_action": "After a week of real use: marketplace repo + plugin.json + install docs",
      "notes": []
    }
  ]
};
// BOARD-DATA-END

const COLUMNS = [
  { key: "idea",    label: "Ideas",   callsign: "[PROPOSED]" },
  { key: "active",  label: "Active",  callsign: "[GO]" },
  { key: "shipped", label: "Shipped", callsign: "[COMPLETE]" },
  { key: "parked",  label: "Parked",  callsign: "[HOLD]" },
  { key: "dropped", label: "Dropped", callsign: "[SCRUBBED]" }
];

const esc = s => String(s ?? "").replace(/[&<>"]/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function daysSince(iso) {
  const then = new Date(iso + "T00:00:00");
  return Math.max(0, Math.floor((Date.now() - then.getTime()) / 86400000));
}

function card(p) {
  let inner = `<div class="card-top"><h3 class="title">${esc(p.title)}</h3>` +
    (p.area ? `<span class="area">${esc(p.area)}</span>` : "") + `</div>`;

  if (p.status === "parked" && p.parked_since) {
    const d = daysSince(p.parked_since);
    const heat = d > 45 ? " hot" : d < 14 ? " cool" : "";
    inner += `<span class="days${heat}">HOLD T+${d}d · since ${esc(p.parked_since)}</span>`;
    if (p.parked_reason) inner += `<p class="why">${esc(p.parked_reason)}</p>`;
    if (p.unblock) inner += `<p class="next"><b>To resume</b> — ${esc(p.unblock)}</p>`;
  } else if (p.next_action) {
    inner += `<p class="next"><b>Next</b> — ${esc(p.next_action)}</p>`;
  }

  if (p.tasks && p.tasks.length) {
    const done = p.tasks.filter(t => t.done).length;
    inner += `<details class="check"><summary class="check-head">Checklist ${done}/${p.tasks.length}</summary>` +
      `<ul class="tasks">` + p.tasks.map(t =>
        `<li class="task${t.done ? " done" : ""}"><span class="box">${t.done ? "▣" : "▢"}</span>` +
        `<span class="task-text">${esc(t.text)}</span></li>`).join("") + `</ul></details>`;
  }

  if (p.notes && p.notes.length)
    inner += `<details class="check"><summary class="check-head">Notes ×${p.notes.length}</summary>` +
      `<ul class="notes">${p.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul></details>`;
  if (p.status === "shipped" && p.shipped_on)
    inner += `<div class="meta">Mission complete · ${esc(p.shipped_on)}</div>`;

  return `<article class="cardx s-${esc(p.status)}">${inner}</article>`;
}

function render() {
  const byStatus = {};
  for (const p of BOARD.projects) (byStatus[p.status] ??= []).push(p);

  document.getElementById("columns").innerHTML = COLUMNS
    .filter(c => (byStatus[c.key] || []).length || ["idea", "active", "shipped", "parked"].includes(c.key))
    .map(c => {
      const items = byStatus[c.key] || [];
      const body = items.length ? items.map(card).join("") : `<div class="empty">nothing here</div>`;
      return `<section class="col col-${c.key}"><div class="col-head">${c.label}` +
        `<span class="callsign">${c.callsign}</span>` +
        `<span class="count">${items.length}</span></div><div class="stack">${body}</div></section>`;
    }).join("");

  const counts = COLUMNS.map(c => [(byStatus[c.key] || []).length, c.label])
    .filter(([n]) => n).map(([n, l]) => `${l} ${n}`).join(" · ");
  document.getElementById("tally").textContent = (BOARD.board ? BOARD.board.toUpperCase() + " · " : "") + counts;
  document.getElementById("stamp").textContent = "T-0 " + BOARD.updated;

  const parked = (byStatus.parked || []).filter(p => p.parked_since)
    .sort((a, b) => a.parked_since.localeCompare(b.parked_since));
  if (parked.length) {
    const p = parked[0];
    const nag = document.getElementById("nag");
    nag.style.display = "block";
    nag.innerHTML = `<span class="nag-label">Longest hold</span>` +
      `<strong>${esc(p.title)}</strong> — ${daysSince(p.parked_since)} days. ` +
      (p.unblock ? `<span class="nag-unblock">Clearance to resume: ${esc(p.unblock)}</span>` : "");
  }
}
render();
</script>
